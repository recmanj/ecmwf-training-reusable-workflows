[project]
name = "gha-ci-notebook-checks"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4==4.15.0",
    "click>=8.1.8,<8.2",  # pynblint 0.1.6 pins typer<0.13, which crashes with click>=8.2
    "lxml==6.1.3",
    "pynblint==0.1.6",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "ruff==0.16.10",
]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
